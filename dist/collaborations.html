<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Try the GLOSS collaboration workflow with example shoot posts, requests, and creative teams.">
  <title>Collaboration studio demo · GLOSS</title>
  <link rel="stylesheet" href="/studio.css">
  <script src="/collaboration-entry.js"></script>
</head>
<body>
  <header class="collab-header">
    <a class="brand" href="/">GLOSS</a>
    <a class="quiet-link" id="collaboration-back" href="/studio/models">Model studio</a>
  </header>
  <main class="collab-shell">
    <p class="collab-demo-note">Collaboration demo · Fictional profiles and shoot posts. Requests and team selections stay in this browser.</p>
<div id="gloss-shoot-studio" aria-label="GLOSS shoot collaboration workspace">
  <style>
    #gloss-shoot-studio {
      --gs-paper: light-dark(#f7f2eb, #241d22);
      --gs-card: light-dark(#fffdf8, #332830);
      --gs-ink: light-dark(#35232f, #f6eaf0);
      --gs-muted: light-dark(#71616b, #c6b3bf);
      --gs-plum: light-dark(#622f51, #e1b4d0);
      --gs-on-plum: light-dark(#fff8fb, #2c1a25);
      --gs-tint: light-dark(#eee2e8, #473340);
      --gs-line: light-dark(#dacdd3, #604b59);
      --gs-olive: light-dark(#e4e8d6, #3a4532);
      --gs-on-olive: light-dark(#37482a, #e5efdc);
      --gs-error: light-dark(#a33137, #ffb6ba);
      color-scheme: light dark;
      color: var(--gs-ink);
      background: var(--gs-paper);
      border: 1px solid var(--gs-line);
      border-radius: 15px;
      font: 400 14px/1.5 "Instrument Sans", system-ui, sans-serif;
      overflow: hidden;
    }
    #gloss-shoot-studio * { box-sizing: border-box; }
    #gloss-shoot-studio [hidden] { display: none !important; }
    #gloss-shoot-studio h2, #gloss-shoot-studio h3, #gloss-shoot-studio p { margin: 0; }
    #gloss-shoot-studio button, #gloss-shoot-studio input, #gloss-shoot-studio select, #gloss-shoot-studio textarea { font: inherit; }
    #gloss-shoot-studio button { cursor: pointer; }
    #gloss-shoot-studio button:disabled { opacity: .55; cursor: default; }
    #gloss-shoot-studio .gs-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 18px 26px 12px; }
    #gloss-shoot-studio .gs-brand { display: flex; align-items: baseline; gap: 12px; }
    #gloss-shoot-studio .gs-logo { font-size: 25px; letter-spacing: -1.5px; font-weight: 500; }
    #gloss-shoot-studio .gs-small { font-size: 12px; color: var(--gs-muted); }
    #gloss-shoot-studio .gs-actor { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 12px; margin-right: 85px; }
    #gloss-shoot-studio .gs-actor select { width: auto; max-width: 230px; padding: 6px 9px; }
    #gloss-shoot-studio .gs-nav { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 26px 15px; border-bottom: 1px solid var(--gs-line); }
    #gloss-shoot-studio .gs-nav button, #gloss-shoot-studio .gs-subnav button { border: 0; padding: 9px 12px; border-radius: 7px; background: transparent; color: var(--gs-muted); font-weight: 500; }
    #gloss-shoot-studio .gs-nav button[aria-current="page"] { background: var(--gs-plum); color: var(--gs-on-plum); }
    #gloss-shoot-studio .gs-subnav { display: flex; flex-wrap: wrap; gap: 5px; padding-bottom: 20px; }
    #gloss-shoot-studio .gs-subnav button[aria-current="page"] { background: var(--gs-tint); color: var(--gs-plum); }
    #gloss-shoot-studio .gs-body { padding: 22px 26px 26px; }
    #gloss-shoot-studio h2 { font: 400 33px/1.1 "Baskervville", Georgia, serif; letter-spacing: -.85px; }
    #gloss-shoot-studio h3 { font-size: 17px; font-weight: 500; }
    #gloss-shoot-studio .gs-kicker { color: var(--gs-plum); text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin-bottom: 6px; }
    #gloss-shoot-studio .gs-title { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 15px; }
    #gloss-shoot-studio .gs-lede { color: var(--gs-muted); max-width: 65ch; margin-top: 9px; }
    #gloss-shoot-studio .gs-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 39px; gap: 7px; border: 1px solid var(--gs-line); border-radius: 7px; padding: 8px 12px; background: var(--gs-card); color: var(--gs-ink); font-weight: 500; text-decoration: none; }
    #gloss-shoot-studio .gs-primary { background: var(--gs-plum); color: var(--gs-on-plum); border-color: var(--gs-plum); }
    #gloss-shoot-studio .gs-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    #gloss-shoot-studio label { display: flex; flex-direction: column; gap: 5px; color: var(--gs-muted); font-size: 12px; }
    #gloss-shoot-studio input, #gloss-shoot-studio select, #gloss-shoot-studio textarea { min-width: 0; max-width: 100%; width: 100%; padding: 10px 11px; border: 1px solid var(--gs-line); border-radius: 6px; background: var(--gs-card); color: var(--gs-ink); }
    #gloss-shoot-studio textarea { min-height: 80px; resize: vertical; }
    #gloss-shoot-studio .gs-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0 16px; }
    #gloss-shoot-studio .gs-posts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    #gloss-shoot-studio .gs-post { background: var(--gs-card); border: 1px solid var(--gs-line); border-radius: 10px; overflow: hidden; }
    #gloss-shoot-studio .gs-cover { display: block; width: 100%; height: 150px; object-fit: cover; object-position: center 30%; }
    #gloss-shoot-studio .gs-post-copy { padding: 16px; display: flex; flex-direction: column; align-items: start; gap: 10px; }
    #gloss-shoot-studio .gs-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    #gloss-shoot-studio .gs-chip { border-radius: 5px; background: var(--gs-tint); color: var(--gs-plum); padding: 3px 7px; font-size: 11px; }
    #gloss-shoot-studio .gs-panel { background: var(--gs-card); border: 1px solid var(--gs-line); border-radius: 9px; padding: 16px; }
    #gloss-shoot-studio .gs-split { display: grid; grid-template-columns: 1.12fr 1fr; gap: 22px; margin-top: 20px; align-items: start; }
    #gloss-shoot-studio .gs-stack { display: grid; gap: 14px; }
    #gloss-shoot-studio .gs-brief-photo { display: block; width: 100%; height: 190px; object-fit: cover; object-position: center 30%; border-radius: 8px; }
    #gloss-shoot-studio .gs-facts { display: grid; gap: 13px; margin: 16px 0; }
    #gloss-shoot-studio dt { font-weight: 500; }
    #gloss-shoot-studio dd { margin: 3px 0 0; color: var(--gs-muted); }
    #gloss-shoot-studio .gs-money { padding: 12px 14px; border-radius: 8px; background: var(--gs-olive); color: var(--gs-on-olive); }
    #gloss-shoot-studio .gs-money p { font-size: 12px; margin-top: 4px; }
    #gloss-shoot-studio .gs-form { display: grid; gap: 13px; margin-top: 20px; }
    #gloss-shoot-studio .gs-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    #gloss-shoot-studio fieldset { margin: 0; padding: 12px; border: 1px solid var(--gs-line); border-radius: 7px; min-width: 0; }
    #gloss-shoot-studio legend { padding: 0 5px; color: var(--gs-muted); font-size: 12px; }
    #gloss-shoot-studio .gs-role-choices { display: flex; flex-wrap: wrap; gap: 10px 17px; }
    #gloss-shoot-studio .gs-check { flex-direction: row; align-items: center; color: var(--gs-ink); }
    #gloss-shoot-studio .gs-check input { width: 16px; height: 16px; accent-color: var(--gs-plum); }
    #gloss-shoot-studio .gs-team { list-style: none; padding: 0; margin: 12px 0 16px; display: grid; gap: 12px; }
    #gloss-shoot-studio .gs-team li { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
    #gloss-shoot-studio .gs-team strong { font-weight: 500; }
    #gloss-shoot-studio .gs-team small { display: block; color: var(--gs-muted); font-size: 12px; margin-top: 2px; }
    #gloss-shoot-studio .gs-link { border: 0; background: transparent; color: var(--gs-plum); text-decoration: underline; padding: 5px; font-size: 12px; }
    #gloss-shoot-studio .gs-requests { display: grid; gap: 11px; margin-top: 15px; }
    #gloss-shoot-studio .gs-request { border-top: 1px solid var(--gs-line); padding-top: 13px; }
    #gloss-shoot-studio .gs-request p { margin-block: 6px 10px; color: var(--gs-muted); }
    #gloss-shoot-studio .gs-confirmed { background: var(--gs-olive); color: var(--gs-on-olive); padding: 10px 13px; border-radius: 7px; margin-top: 16px; }
    #gloss-shoot-studio .gs-empty { color: var(--gs-muted); margin-block: 20px; }
    #gloss-shoot-studio .gs-toast { color: var(--gs-plum); font-size: 12px; margin-top: 16px; }
    #gloss-shoot-studio .gs-error { color: var(--gs-error); }
    #gloss-shoot-studio .gs-footer { border-top: 1px solid var(--gs-line); padding: 12px 26px; color: var(--gs-muted); font-size: 12px; }
    @media(max-width:650px) {
      #gloss-shoot-studio .gs-posts, #gloss-shoot-studio .gs-split { grid-template-columns: 1fr; }
      #gloss-shoot-studio .gs-body { padding: 19px 18px; }
      #gloss-shoot-studio .gs-head { padding: 17px 18px 12px; }
      #gloss-shoot-studio .gs-nav { padding-inline: 18px; }
      #gloss-shoot-studio .gs-actor { margin-right: 0; width: 100%; }
      #gloss-shoot-studio h2 { font-size: 28px; }
      #gloss-shoot-studio .gs-footer { padding-inline: 18px; }
    }
    @media(max-width:400px) {
      #gloss-shoot-studio .gs-pair, #gloss-shoot-studio .gs-filters { grid-template-columns: 1fr; }
      #gloss-shoot-studio .gs-nav button { padding: 8px; font-size: 12px; }
      #gloss-shoot-studio .gs-subnav button { padding: 8px; font-size: 12px; }
    }
    @media(pointer:coarse) {
      #gloss-shoot-studio button { min-height: 44px; }
      #gloss-shoot-studio input, #gloss-shoot-studio select, #gloss-shoot-studio textarea { font-size: 16px; }
    }
  </style>
  <header class="gs-head">
    <div class="gs-brand"><span class="gs-logo">Collaboration studio</span><span class="gs-small">Shoot Studio</span></div>
    <label class="gs-actor">Preview as<select data-actor aria-label="Preview as a collaborator"></select></label>
  </header>
  <nav class="gs-nav" aria-label="Portfolio journey">
    <button type="button" data-stage="collaborate" aria-current="page">1 · Collaborate</button>
    <button type="button" data-stage="portfolio">2 · Portfolio</button>
    <button type="button" data-stage="agencies">3 · Agencies</button>
  </nav>
  <main class="gs-body" data-body></main>
  <footer class="gs-footer">Fictional people and shoot posts. Posting, requests, team selection, and agency applications are simulated in this concept.</footer>
  <script>
    (() => {
      const root = document.getElementById('gloss-shoot-studio');
      const body = root.querySelector('[data-body]');
      const actorPicker = root.querySelector('[data-actor]');
      const images = {
        traditional: '/assets/makeup-sample-bridal.jpg',
        portraits: '/assets/model-sample-polaroid-front.jpg',
        beauty: '/assets/hero-makeup.jpg'
      };
      const people = [
        {id:'mira', name:'Mira Sen', role:'Model', city:'Bengaluru', offer:'I can model, prepare poses, and share the final work with agreed credits.'},
        {id:'tara', name:'Tara Kapoor', role:'Photographer', city:'Bengaluru', offer:'I can photograph the concept, arrange a shared studio, and deliver five edited selects.'},
        {id:'sana', name:'Sana Mehta', role:'Makeup artist', city:'Bengaluru', offer:'I can create the traditional makeup look and bring the products and touch-up kit.'},
        {id:'ishaan', name:'Ishaan Hair', role:'Hair artist', city:'Bengaluru', offer:'I can create a traditional updo and bring the styling tools.'},
        {id:'thread', name:'Kabir Verma', role:'Fashion designer', city:'Bengaluru', offer:'I can arrange a traditional outfit loan and help style the drape and jewellery.'},
        {id:'naina', name:'Naina Roy', role:'Senior model / mentor', city:'Bengaluru', offer:'I can help the team practise poses and prepare the shot list.'},
        {id:'rhea', name:'Rhea Thomas', role:'Photographer', city:'Mumbai', offer:'I can shoot clean casting portraits and deliver a selection for the team portfolios.'}
      ];
      const roles = [...new Set(people.map(person => person.role))];
      const agencies = [
        {id:'north', name:'Studio North Talent', city:'Bengaluru', fields:['Editorial','Commercial'], description:'Fashion stories and commercial representation.'},
        {id:'frame', name:'Frame House Models', city:'Bengaluru', fields:['E-commerce','Print'], description:'Catalogue, product, and print work.'},
        {id:'runway', name:'Runway Collective', city:'Mumbai', fields:['Editorial','Runway'], description:'Runway and fashion editorial representation.'},
        {id:'beauty', name:'The Beauty House', city:'Mumbai', fields:['Beauty','Commercial'], description:'Beauty and commercial images.'}
      ];
      const seed = {
        version:3, actor:'mira', view:'board', selectedPost:null, requestForm:false,
        city:'Bengaluru', roleFilter:'All roles', agencyCity:'Bengaluru', agencyField:'Editorial',
        selectedAgency:null, portfolioItems:{}, applications:[], notice:'', error:'',
        posts:[
          {id:'padma', owner:'mira', title:'Padmavati-inspired traditional shoot', city:'Bengaluru', style:'traditional',
           concept:'A royal traditional editorial with a red drape, statement jewellery, an elegant updo, and warm portraits.',
           timing:'Weekend · Date to agree', venue:'Shared studio to be arranged with the photographer.',
           exchange:'Five edited selects for the team portfolios, with credits. Agree a ₹0 model contribution covering the venue, styling, products, and travel plan.',
           contribution:'I will model and prepare the concept references and poses.',
           roles:['Photographer','Makeup artist','Hair artist','Fashion designer'], finalized:false, completed:false},
          {id:'casting', owner:'tara', title:'Clean casting portraits', city:'Bengaluru', style:'portraits',
           concept:'Natural front, profile, and three-quarter portraits with minimal styling for a first portfolio.',
           timing:'Weekend · Date to agree', venue:'Shared daylight studio offered by the photographer.',
           exchange:'Five edited selects with team credits. Proposed model contribution ₹0; confirm the full plan together.',
           contribution:'I provide photography, the shared studio, and the image selection.',
           roles:['Model','Makeup artist'], finalized:false, completed:false},
          {id:'glow', owner:'sana', title:'Gold & glow beauty story', city:'Bengaluru', style:'beauty',
           concept:'A beauty test exploring warm metallic eyes, skin detail, and soft hair.',
           timing:'Afternoon · Date to agree', venue:'Studio arrangement to be agreed with the team.',
           exchange:'Beauty selects for everyone’s portfolio with credits, within an agreed ₹0 model contribution.',
           contribution:'I provide the makeup look, products, and touch-ups.',
           roles:['Model','Photographer','Hair artist'], finalized:false, completed:false},
          {id:'mumbai-test', owner:'rhea', title:'First portfolio portrait session', city:'Mumbai', style:'portraits',
           concept:'Simple portraits and profile views to start a modelling portfolio.',
           timing:'Weekend · Date to agree', venue:'Photographer’s shared space.',
           exchange:'A small selection for the team portfolios, with credits and a ₹0 model contribution agreed upfront.',
           contribution:'I provide the camera, space, and portrait edit.',
           roles:['Model','Makeup artist'], finalized:false, completed:false}
        ],
        requests:[
          {post:'padma', actor:'sana', status:'requested', message:'I would love to create the traditional makeup look. I can provide the products and touch-ups.'},
          {post:'padma', actor:'ishaan', status:'requested', message:'I can create a royal updo and bring the hair tools for the shoot.'},
          {post:'padma', actor:'thread', status:'requested', message:'I would like to join with a traditional outfit loan and styling for the jewellery and drape.'}
        ]
      };
      let state = structuredClone(seed);
      const person = id => people.find(item => item.id === id);
      const viewer = () => person(state.actor);
      const postById = id => state.posts.find(post => post.id === id);
      const selectedRequests = post => state.requests.filter(request => request.post === post.id && request.status === 'selected');
      const members = post => [post.owner, ...selectedRequests(post).map(request => request.actor)];
      const canEnter = post => members(post).includes(state.actor);
      const isOwner = post => post.owner === state.actor;
      const requestFor = post => state.requests.find(request => request.post === post.id && request.actor === state.actor);
      const emptyRoles = post => post.roles.filter(role => !selectedRequests(post).some(request => person(request.actor).role === role));
      const escape = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      function button(label, action, value = '', primary = false, disabled = false) {
        return '<button type="button" class="gs-btn' + (primary ? ' gs-primary' : '') + '" data-action="' + action +
          '" data-value="' + escape(value) + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button>';
      }
      function photo(post, css = 'gs-cover') {
        return '<img class="' + css + '" src="' + images[post.style] + '" alt="Illustrative reference for ' + escape(post.title) + '">';
      }
      function options(values, value) {
        return values.map(item => '<option' + (item === value ? ' selected' : '') + '>' + escape(item) + '</option>').join('');
      }
      function selectionStatus(request, post) {
        if (request.status === 'selected') return post.finalized ? 'Assigned to the finalized team' : 'Selected for the team';
        return request.status === 'declined' ? 'Request declined' : 'Request sent · Awaiting organiser';
      }
      function collabNavigation() {
        return '<nav class="gs-subnav" aria-label="Collaboration sections">' +
          [['board','Find collaborations'],['studio','My Shoot Studio'],['requests','My requests']].map(([view,label]) =>
            '<button type="button" data-view="' + view + '"' + (state.view === view ? ' aria-current="page"' : '') + '>' + label + '</button>').join('') + '</nav>';
      }
      function postCard(post) {
        const owner = person(post.owner);
        const request = requestFor(post);
        return '<article class="gs-post">' + photo(post) + '<div class="gs-post-copy"><p class="gs-kicker">' +
          (isOwner(post) ? 'Your posted concept' : 'Posted by ' + escape(owner.name) + ' · ' + escape(owner.role)) +
          '</p><h3>' + escape(post.title) + '</h3><p class="gs-small">' + escape(post.city) + ' · ' + escape(post.timing) +
          '</p><div class="gs-chips" aria-label="Roles needed">' + emptyRoles(post).map(role => '<span class="gs-chip">' +
          escape(role) + '</span>').join('') + '</div><p class="gs-small">₹0 model contribution proposed · Portfolio exchange</p><div class="gs-actions">' +
          button(isOwner(post) ? 'Manage requests' : request ? 'View my request' : 'View concept', isOwner(post) ? 'workspace' : 'post', post.id, true) +
          '</div></div></article>';
      }
      function board() {
        const results = state.posts.filter(post => post.published !== false && !post.finalized && post.city === state.city &&
          (state.roleFilter === 'All roles' || emptyRoles(post).includes(state.roleFilter)));
        return collabNavigation() + '<section aria-label="Posted shoot collaborations"><div class="gs-title"><div><p class="gs-kicker">A concept looking for its team</p>' +
          '<h2>Find collaborations</h2></div>' + button('Post a shoot concept', 'new', '', true) + '</div>' +
          '<p class="gs-lede">Explore posted shoots, find a role for your craft, and send a request to join.</p>' +
          '<div class="gs-filters"><label>Location<select data-filter="city">' + options(['Bengaluru','Mumbai'],state.city) +
          '</select></label><label>Looking for<select data-filter="roleFilter">' + options(['All roles',...roles],state.roleFilter) +
          '</select></label></div>' + (results.length ? '<div class="gs-posts">' + results.map(postCard).join('') +
          '</div>' : '<p class="gs-empty">There are no example posts for these filters. Try another role or location.</p>') + '</section>';
      }
      function postDetail() {
        const post = postById(state.selectedPost);
        if (!post) return board();
        if (post.published === false && !isOwner(post)) return board();
        const owner = person(post.owner);
        const request = requestFor(post);
        const roleOpen = emptyRoles(post).includes(viewer().role);
        const canRequest = post.published !== false && !isOwner(post) && !post.finalized && !request && roleOpen;
        return collabNavigation() + '<section aria-label="Shoot concept">' + button('← Posted shoots','board') +
          '<div class="gs-split"><div>' + photo(post,'gs-brief-photo') + '<p class="gs-kicker" style="margin-top:16px">Posted by ' +
          escape(owner.name) + ' · ' + escape(owner.role) + '</p><h2>' + escape(post.title) + '</h2><p class="gs-lede">' +
          escape(post.concept) + '</p><dl class="gs-facts"><div><dt>When &amp; where</dt><dd>' + escape(post.timing) + ' · ' + escape(post.city) +
          '</dd></div><div><dt>Studio / venue plan</dt><dd>' + escape(post.venue) + '</dd></div><div><dt>The organiser brings</dt><dd>' +
          escape(post.contribution) + '</dd></div><div><dt>The exchange</dt><dd>' + escape(post.exchange) + '</dd></div></dl></div>' +
          '<aside class="gs-stack"><div class="gs-panel"><h3>Roles to fill</h3><ul class="gs-team">' +
          post.roles.map(role => '<li><span>' + escape(role) + '</span><span class="gs-small">' + (emptyRoles(post).includes(role) ? 'Open' : 'Selected') + '</span></li>').join('') +
          '</ul>' + (isOwner(post) ? button('Manage requests in workspace','workspace',post.id,true) :
          request ? '<p class="gs-small" role="status">' + selectionStatus(request,post) + '</p>' +
            (canEnter(post) ? button('Open shoot workspace','workspace',post.id,true) : '') :
          post.finalized ? '<p class="gs-small">The team has been finalized.</p>' :
          canRequest ? (state.requestForm ? '<p class="gs-small">Your request to join this concept</p>' : button('Send request','request-form',post.id,true)) : '<p class="gs-small">The open roles are listed above.</p>') + '</div>' +
          (state.requestForm && canRequest ? '<form class="gs-panel gs-form" data-form="request"><h3>Join as ' + escape(viewer().role) +
          '</h3><p class="gs-small">' + escape(viewer().name) + ' · ' + escape(viewer().city) + '</p><label>Your contribution<textarea name="message" maxlength="280" required>' +
          escape(viewer().offer) + '</textarea></label><button class="gs-btn gs-primary" type="submit">Send request</button>' +
          button('Cancel','cancel-request') + '</form>' : '') + '</aside></div></section>';
      }
      function composer() {
        const existing = postById(state.selectedPost);
        const draft = existing && isOwner(existing) && existing.published === false ? existing : null;
        return collabNavigation() + '<section aria-label="Create a collaboration post"><p class="gs-kicker">Planning as ' + escape(viewer().name) +
          ' · ' + escape(viewer().role) + '</p><h2>Start in your Shoot Studio</h2><form class="gs-form" data-form="post">' +
          '<label>Shoot title<input name="title" maxlength="90" placeholder="Padmavati-inspired traditional shoot" value="' + escape(draft?.title || '') + '" required></label>' +
          '<label>The concept<textarea name="concept" maxlength="400" placeholder="The look, mood, and images you want to create" required>' + escape(draft?.concept || '') + '</textarea></label>' +
          '<div class="gs-pair"><label>Location<select name="city">' + options(['Bengaluru','Mumbai'],draft?.city || viewer().city) +
          '</select></label><label>Style<select name="style">' + [['traditional','Traditional'],['portraits','Casting portraits'],['beauty','Beauty']].map(([value,label])=>
            '<option value="' + value + '"' + (draft?.style===value ? ' selected' : '') + '>' + label + '</option>').join('') + '</select></label></div>' +
          '<div class="gs-pair"><label>Preferred date / availability<input name="timing" maxlength="100" placeholder="Weekend · Date to agree" value="' + escape(draft?.timing || '') + '" required></label>' +
          '<label>Studio / venue plan<input name="venue" maxlength="180" placeholder="Shared studio, outdoor space, or venue to agree" value="' + escape(draft?.venue || '') + '" required></label></div>' +
          '<label>What I bring<input name="contribution" maxlength="180" value="' + escape(draft?.contribution || viewer().offer) + '" required></label>' +
          '<fieldset><legend>Who would you like to join?</legend><div class="gs-role-choices">' +
          roles.filter(role => role !== viewer().role).map(role => '<label class="gs-check"><input name="roles" type="checkbox" value="' +
          escape(role) + '"' + (draft?.roles.includes(role) ? ' checked' : '') + '>' + escape(role) + '</label>').join('') + '</div></fieldset>' +
          '<label>Images, credits &amp; exchange<textarea name="exchange" maxlength="350" required>' +
          escape(draft?.exchange || 'Portfolio images for the team with agreed credits. Plan a ₹0 total contribution from the model, including the venue, styling, products, and travel arrangements.') + '</textarea></label>' +
          '<div class="gs-actions"><button class="gs-btn gs-primary" type="submit" name="intent" value="publish">Post collaboration</button>' +
          '<button class="gs-btn" type="submit" name="intent" value="draft" formnovalidate>Save concept draft</button>' +
          button('Cancel','studio') + '</div></form></section>';
      }
      function studio() {
        const workspaces = state.posts.filter(canEnter);
        return collabNavigation() + '<section aria-label="My shoot workspaces"><div class="gs-title"><div><p class="gs-kicker">Your concepts and assigned teams</p>' +
          '<h2>My Shoot Studio</h2></div>' + button('Plan a new shoot','new','',true) + '</div>' +
          (workspaces.length ? '<div class="gs-requests">' + workspaces.map(post => '<article class="gs-panel"><p class="gs-kicker">' +
            (isOwner(post) ? 'Organiser' : 'Selected collaborator') + ' · ' + (post.published === false ? 'Concept draft' : post.finalized ? 'Team finalized' : 'Team forming') +
            '</p><h3>' + escape(post.title) + '</h3><p class="gs-small" style="margin:8px 0 13px">' +
            escape(post.city) + ' · ' + members(post).length + ' team members</p>' + button('Open workspace','workspace',post.id,true) + '</article>').join('') +
            '</div>' : '<p class="gs-empty">Your posted concepts and shoots you are selected for will appear here.</p>') + '</section>';
      }
      function workspace() {
        const post = postById(state.selectedPost);
        if (!post || !canEnter(post)) return studio();
        const selected = selectedRequests(post);
        const pending = state.requests.filter(request => request.post === post.id && request.status === 'requested');
        const missing = emptyRoles(post);
        return collabNavigation() + '<section aria-label="Shared shoot workspace">' + button('← My Shoot Studio','studio') +
          '<p class="gs-kicker" style="margin-top:18px">' + (post.published === false ? 'Private concept draft' : 'Shared shoot workspace') + ' · ' + (isOwner(post) ? 'Organiser view' : 'Team member view') +
          '</p><h2>' + escape(post.title) + '</h2>' +
          (post.finalized ? '<p class="gs-confirmed" role="status">Team finalized · Everyone has an assigned role.</p>' : '') +
          '<div class="gs-split"><div class="gs-stack"><div class="gs-panel"><h3>Shared brief</h3><p class="gs-lede">' + escape(post.concept) +
          '</p><dl class="gs-facts"><div><dt>When &amp; where</dt><dd>' + escape(post.timing) + ' · ' + escape(post.city) +
          '</dd></div><div><dt>Studio / venue plan</dt><dd>' + escape(post.venue) + '</dd></div><div><dt>Images &amp; credits</dt><dd>' +
          escape(post.exchange) + '</dd></div></dl><div class="gs-money">Proposed model contribution · ₹0<p>Confirm what the team provides within this plan.</p></div></div>' +
          (isOwner(post) && post.published !== false ? '<div><h3>Requests to join' + (pending.length ? ' (' + pending.length + ')' : '') + '</h3><div class="gs-requests">' +
            (pending.length ? pending.map(request => '<article class="gs-request"><h3>' + escape(person(request.actor).name) +
              '</h3><p class="gs-small">' + escape(person(request.actor).role) + '</p><p>' + escape(request.message) +
              '</p><div class="gs-actions">' + button(missing.includes(person(request.actor).role) ? 'Select for team' : 'Role filled','select',request.actor,true,
                post.finalized || !missing.includes(person(request.actor).role)) + button('Decline','decline',request.actor,false,post.finalized) + '</div></article>').join('') :
              '<p class="gs-small">New requests for open roles will appear here.</p>') + '</div></div>' : '') +
          '</div><aside class="gs-panel"><h3>' + (post.finalized ? 'Assigned group' : 'Your selected team') + '</h3><ul class="gs-team"><li><div><strong>' +
          escape(person(post.owner).name) + '</strong><small>' + escape(person(post.owner).role) + ' · Organiser</small></div></li>' +
          selected.map(request => '<li><div><strong>' + escape(person(request.actor).name) + '</strong><small>' + escape(person(request.actor).role) +
            '</small></div>' + (isOwner(post) ? '<button class="gs-link" type="button" data-action="unselect" data-value="' +
            request.actor + '">Remove</button>' : '') + '</li>').join('') +
          missing.map(role => '<li><div>' + escape(role) + '<small>Awaiting selection</small></div></li>').join('') + '</ul>' +
          (post.published === false ? button('Edit &amp; post concept','edit-draft',post.id,true) : '') +
          (isOwner(post) && post.published !== false && !post.finalized ? button('Finalize team','finalize',post.id,true,missing.length>0) +
            (missing.length ? '<p class="gs-small" style="margin-top:9px">Fill the open roles to finalize this group.</p>' : '') : '') +
          (post.finalized && isOwner(post) && !post.completed ? '<div style="margin-top:12px">' + button('Try completed-shoot example','complete',post.id,true) + '</div>' : '') +
          (post.completed ? '<p class="gs-small" style="margin-bottom:10px">Sample shoot completed.</p>' + button('Add sample work to my portfolio','portfolio-add',post.id,true) : '') +
          '</aside></div></section>';
      }
      function myRequests() {
        const requests = state.requests.filter(request => request.actor === state.actor);
        return collabNavigation() + '<section aria-label="Requests I sent"><h2>My requests</h2>' +
          (requests.length ? '<div class="gs-requests">' + requests.map(request => {
            const post = postById(request.post);
            return '<article class="gs-panel"><p class="gs-kicker">' + selectionStatus(request,post) + '</p><h3>' +
              escape(post.title) + '</h3><p class="gs-small" style="margin:8px 0 12px">Organised by ' + escape(person(post.owner).name) +
              '</p>' + button(request.status === 'selected' ? 'Open shoot workspace' : 'View concept',request.status === 'selected' ? 'workspace' : 'post',post.id,true) + '</article>';
          }).join('') + '</div>' : '<p class="gs-empty">Send a request from a posted concept to join a shoot.</p>') + '</section>';
      }
      function portfolio() {
        const work = state.portfolioItems[state.actor] || [];
        return '<section aria-label="My portfolio"><p class="gs-kicker">' + escape(viewer().name) + ' · ' + escape(viewer().role) +
          '</p><h2>From collaboration to portfolio</h2>' + (work.length ? '<div class="gs-requests">' + work.map(item =>
          '<article class="gs-post">' + photo(item) + '<div class="gs-post-copy"><h3>' + escape(item.title) +
          '</h3><p class="gs-small">' + item.credits.map(id=>escape(person(id).name) + ' · ' + escape(person(id).role)).join('<br>') +
          '</p><p class="gs-small">Illustrative completed-work example with team credits.</p></div></article>').join('') + '</div><div class="gs-actions" style="margin-top:18px">' +
          (viewer().role === 'Model' ? button('Explore enrolled agencies →','agencies','',true) : button('Find another collaboration','board','',true)) + '</div>' :
          '<p class="gs-empty">Work from a completed shoot can be added here with the team credits.</p>' + button('Open My Shoot Studio','studio','',true)) + '</section>';
      }
      function agencyNetwork() {
        const work = state.portfolioItems[state.actor] || [];
        const agency = agencies.find(item => item.id === state.selectedAgency);
        if (agency) return '<section aria-label="Agency application">' + button('← Agencies','agencies') +
          '<p class="gs-kicker" style="margin-top:18px">Example enrolled agency</p><h2>' + agency.name + '</h2><p class="gs-lede">' + agency.description +
          '</p><p style="margin-top:16px">' + escape(viewer().name) + ' · ' + escape(viewer().role) + '</p>' +
          (viewer().role === 'Model' && work.length ? '<p class="gs-small" style="margin:10px 0 16px">Attached portfolio · ' + escape(work[0].title) +
          ' with team credits.</p>' + button('Save application preview','agency-apply',agency.id,true) :
          '<p class="gs-empty">Apply from a model profile with finished portfolio work attached.</p>') +
          '<p class="gs-small" style="margin-top:14px">The agency reviews the portfolio before offering representation.</p></section>';
        const results = agencies.filter(item => item.city === state.agencyCity && item.fields.includes(state.agencyField));
        const applications = state.applications.filter(item => item.actor === state.actor);
        return '<section aria-label="Enrolled agency examples"><p class="gs-kicker">The next step for a model’s portfolio</p><h2>Find your agency</h2>' +
          '<div class="gs-filters"><label>Location<select data-filter="agencyCity">' + options(['Bengaluru','Mumbai'],state.agencyCity) +
          '</select></label><label>Modelling field<select data-filter="agencyField">' + options(['Editorial','Runway','E-commerce','Print','Beauty','Commercial'],state.agencyField) +
          '</select></label></div>' + (results.length ? '<div class="gs-posts">' + results.map(item => '<article class="gs-panel"><p class="gs-kicker">Example enrolled agency</p><h3>' +
          item.name + '</h3><p class="gs-small" style="margin:8px 0 14px">' + item.city + ' · ' + item.fields.join(' · ') +
          '</p>' + button('View agency &amp; application','agency',item.id,true) + '</article>').join('') +
          '</div>' : '<p class="gs-empty">No example agency matches these filters.</p>') +
          (applications.length ? '<div style="margin-top:20px"><h3>My application previews</h3>' + applications.map(item =>
          '<p class="gs-small" style="margin-top:9px">' + agencies.find(agency=>agency.id===item.agency).name + ' · Preview saved · ' +
          escape(item.title) + '</p>').join('') + '</div>' : '') + '</section>';
      }
      function render() {
        actorPicker.innerHTML = people.map(item => '<option value="' + item.id + '"' + (state.actor===item.id ? ' selected' : '') +
          '>' + escape(item.name) + ' · ' + escape(item.role) + '</option>').join('');
        const stage = ['portfolio','agencies'].includes(state.view) ? state.view : 'collaborate';
        for (const tab of root.querySelectorAll('[data-stage]')) {
          if (tab.dataset.stage === stage) tab.setAttribute('aria-current','page');
          else tab.removeAttribute('aria-current');
        }
        const views = {board,post:postDetail,new:composer,studio,workspace,requests:myRequests,portfolio,agencies:agencyNetwork};
        body.innerHTML = views[state.view]() +
          (state.error ? '<p class="gs-error" role="alert">' + escape(state.error) + '</p>' : '') +
          (state.notice ? '<p class="gs-toast" role="status">' + escape(state.notice) + '</p>' : '');
      }
      function remember() {
        const snapshot = {modelContent:{glossShootStudio:{version:3,actor:state.actor,view:state.view,
          posts:state.posts,requests:state.requests,portfolioItems:state.portfolioItems,applications:state.applications}},
          privateContent:{glossShootStudio:{selectedPost:state.selectedPost,city:state.city,roleFilter:state.roleFilter,
            agencyCity:state.agencyCity,agencyField:state.agencyField,selectedAgency:state.selectedAgency}}};
        if (JSON.stringify(snapshot).length < 15000) window.glossDemo?.setWidgetState?.(snapshot).catch(()=>{});
      }
      function restore(snapshot) {
        const saved = snapshot?.modelContent?.glossShootStudio;
        const local = snapshot?.privateContent?.glossShootStudio;
        if (saved?.version !== 3) return;
        state = structuredClone(seed);
        if (person(saved.actor)) state.actor = saved.actor;
        if (['board','post','new','studio','workspace','requests','portfolio','agencies'].includes(saved.view)) state.view = saved.view;
        if (Array.isArray(saved.posts)) {
          const safePosts = saved.posts.filter(post => person(post.owner) && typeof post.id==='string' && typeof post.title==='string' &&
            ['Bengaluru','Mumbai'].includes(post.city) && Object.hasOwn(images,post.style) && Array.isArray(post.roles));
          if (safePosts.length) state.posts = safePosts.map(post => ({...post,
            title:String(post.title).slice(0,90), concept:String(post.concept||'').slice(0,400),
            timing:String(post.timing||'').slice(0,100), venue:String(post.venue||'').slice(0,180),
            contribution:String(post.contribution||'').slice(0,180), exchange:String(post.exchange||'').slice(0,350),
            roles:[...new Set(post.roles)].filter(role=>roles.includes(role) && role!==person(post.owner).role),
            published:post.published!==false,finalized:post.finalized===true,completed:post.completed===true}));
        }
        if (Array.isArray(saved.requests)) {
          state.requests = saved.requests.filter(request => postById(request.post) && person(request.actor) &&
            ['requested','selected','declined'].includes(request.status) && request.actor!==postById(request.post).owner &&
            postById(request.post).roles.includes(person(request.actor).role))
            .map(request=>({...request,message:String(request.message||'').slice(0,280)}));
        }
        for (const profile of people) {
          const items = saved.portfolioItems?.[profile.id];
          if (Array.isArray(items)) state.portfolioItems[profile.id] = items.filter(item => typeof item.title==='string' &&
            Object.hasOwn(images,item.style) && Array.isArray(item.credits)).map(item=>({...item,title:item.title.slice(0,90),
              credits:item.credits.filter(id=>person(id))}));
        }
        if (Array.isArray(saved.applications)) state.applications = saved.applications.filter(item=>person(item.actor) &&
          agencies.some(agency=>agency.id===item.agency)).map(item=>({...item,title:String(item.title||'').slice(0,90)}));
        if (local) {
          state.selectedPost = postById(local.selectedPost) ? local.selectedPost : null;
          for (const key of ['city','agencyCity']) if (['Bengaluru','Mumbai'].includes(local[key])) state[key]=local[key];
          if (['All roles',...roles].includes(local.roleFilter)) state.roleFilter=local.roleFilter;
          if (['Editorial','Runway','E-commerce','Print','Beauty','Commercial'].includes(local.agencyField)) state.agencyField=local.agencyField;
          state.selectedAgency = agencies.some(agency=>agency.id===local.selectedAgency) ? local.selectedAgency : null;
        }
      }
      root.addEventListener('click', event => {
        const control = event.target.closest('button');
        if (!control || control.disabled) return;
        const {action,value,stage,view} = control.dataset;
        state.notice=''; state.error='';
        if (stage || view) {
          state.view = stage === 'collaborate' ? 'board' : stage || view;
          state.requestForm=false; state.selectedAgency=null;
        } else if (action) {
          const post = postById(state.selectedPost);
          switch (action) {
            case 'board': case 'studio': case 'new': case 'agencies':
              state.view=action; state.requestForm=false; state.selectedAgency=null;
              if (action==='new') state.selectedPost=null;
              break;
            case 'edit-draft':
              if (!post || !isOwner(post) || post.published!==false) return;
              state.view='new'; break;
            case 'post':
              state.selectedPost=value; state.view='post'; state.requestForm=false; break;
            case 'workspace': {
              const target=postById(value);
              if (!target || !canEnter(target)) return;
              state.selectedPost=value; state.view='workspace'; state.requestForm=false; break;
            }
            case 'request-form':
              if (!post || post.published===false || isOwner(post) || post.finalized || requestFor(post) || !emptyRoles(post).includes(viewer().role)) return;
              state.requestForm=true; break;
            case 'cancel-request': state.requestForm=false; break;
            case 'select': case 'decline': case 'unselect': {
              if (!post || !isOwner(post)) return;
              const request=state.requests.find(item=>item.post===post.id && item.actor===value);
              if (!request) return;
              if (action==='select') {
                if (post.finalized || request.status!=='requested' || !emptyRoles(post).includes(person(value).role)) return;
                request.status='selected'; state.notice=person(value).name+' joined the shoot workspace.';
              } else if (action==='decline') {
                if (post.finalized || request.status!=='requested') return;
                request.status='declined'; state.notice='Request declined.';
              } else {
                if (request.status!=='selected') return;
                request.status='requested'; post.finalized=false; post.completed=false;
                state.notice='Role reopened. The collaborator’s request is back in the request list.';
              }
              break;
            }
            case 'finalize':
              if (!post || post.published===false || !isOwner(post) || emptyRoles(post).length) return;
              post.finalized=true; state.notice='Assigned group finalized.'; break;
            case 'complete':
              if (!post || !isOwner(post) || !post.finalized) return;
              post.completed=true; state.notice='Completed-shoot example ready for the team portfolios.'; break;
            case 'portfolio-add': {
              const completed=postById(value);
              if (!completed || !canEnter(completed) || !completed.completed || !completed.finalized) return;
              const work=state.portfolioItems[state.actor] || [];
              state.portfolioItems[state.actor]=[...work.filter(item=>item.post!==completed.id),
                {post:completed.id,title:completed.title,style:completed.style,credits:[...members(completed)]}];
              state.view='portfolio'; state.notice='Sample work added with the assigned team credits.'; break;
            }
            case 'agency': state.selectedAgency=value; state.view='agencies'; break;
            case 'agency-apply': {
              const work=state.portfolioItems[state.actor] || [];
              if (viewer().role!=='Model' || !work.length || !agencies.some(agency=>agency.id===value)) return;
              state.applications=state.applications.filter(item=>item.actor!==state.actor || item.agency!==value);
              state.applications.push({actor:state.actor,agency:value,title:work[0].title});
              state.selectedAgency=null; state.notice='Agency application preview saved.'; break;
            }
            default: return;
          }
        } else return;
        render(); remember();
      });
      root.addEventListener('change', event => {
        const input=event.target;
        if (input.matches('[data-actor]')) {
          if (!person(input.value)) return;
          state.actor=input.value; state.city=viewer().city; state.view='board'; state.roleFilter='All roles';
          state.selectedPost=null; state.selectedAgency=null; state.requestForm=false; state.notice=''; state.error='';
        } else if (input.dataset.filter) {
          state[input.dataset.filter]=input.value;
        } else return;
        render(); remember();
      });
      root.addEventListener('submit', event => {
        event.preventDefault();
        const form=event.target;
        const fields=new FormData(form);
        state.error=''; state.notice='';
        if (form.dataset.form==='request') {
          const post=postById(state.selectedPost);
          if (!post || post.published===false || isOwner(post) || post.finalized || requestFor(post) || !emptyRoles(post).includes(viewer().role)) return;
          const message=String(fields.get('message')||'').trim().slice(0,280);
          if (!message) {state.error='Describe what you can bring to the shoot.';}
          else {
            state.requests.push({post:post.id,actor:state.actor,status:'requested',message});
            state.requestForm=false; state.notice='Request sent in the demo. The organiser can review it.';
          }
        } else if (form.dataset.form==='post') {
          const saveDraft=event.submitter?.value==='draft';
          const previous=postById(state.selectedPost);
          const editing=previous && isOwner(previous) && previous.published===false ? previous : null;
          const wantedRoles=[...new Set(fields.getAll('roles'))].filter(role=>roles.includes(role) && role!==viewer().role);
          const draft={owner:state.actor, title:String(fields.get('title')||'').trim().slice(0,90),
            concept:String(fields.get('concept')||'').trim().slice(0,400),timing:String(fields.get('timing')||'').trim().slice(0,100),
            venue:String(fields.get('venue')||'').trim().slice(0,180),contribution:String(fields.get('contribution')||'').trim().slice(0,180),
            exchange:String(fields.get('exchange')||'').trim().slice(0,350),city:String(fields.get('city')),
            style:String(fields.get('style')),roles:wantedRoles,published:!saveDraft,finalized:false,completed:false};
          if (!draft.title || (!saveDraft && (!draft.concept || !draft.timing || !draft.venue || !draft.contribution || !draft.exchange || !wantedRoles.length))) {
            state.error=saveDraft ? 'Name your shoot concept to save a draft.' : 'Complete the shoot details and choose at least one role.';
          } else if (['Bengaluru','Mumbai'].includes(draft.city) && Object.hasOwn(images,draft.style)) {
            let count=state.posts.length+1;
            while (postById('shoot-'+count)) count++;
            draft.id=editing ? editing.id : 'shoot-'+count;
            if (editing) state.posts=state.posts.map(item=>item.id===editing.id ? draft : item);
            else state.posts.push(draft);
            state.selectedPost=draft.id; state.view='workspace';
            state.notice=saveDraft ? 'Concept draft saved in your Shoot Studio.' : 'Concept posted. Collaborators can now send requests.';
          }
        } else return;
        if (state.error) {
          const existing=body.querySelector('[role="alert"]');
          if (existing) existing.textContent=state.error;
          else {
            const error=document.createElement('p');
            error.className='gs-error'; error.setAttribute('role','alert'); error.textContent=state.error; form.append(error);
          }
        } else render();
        remember();
      });
      restore(window.glossDemo?.widgetState);
      render();
      window.addEventListener('gloss-demo:set-state',event=>{
        if (event.detail?.globals?.widgetState) {restore(event.detail.globals.widgetState);render();}
      });
    })();
  </script>
</div>
  </main>

    #gloss-shoot-studio { font: 400 1rem/1.6 var(--sans); border-radius: .35rem; }

    #gloss-shoot-studio .gs-kicker, #gloss-shoot-studio .gs-chip { font-size: .75rem; }
    #gloss-shoot-studio .gs-head { gap: 1rem; }
    #gloss-shoot-studio .gs-actor { margin-right: 0; font-size: .875rem; }
    #gloss-shoot-studio .gs-cover { height: 12rem; }
    #gloss-shoot-studio .gs-link { font-size: .875rem; }
  </style>
